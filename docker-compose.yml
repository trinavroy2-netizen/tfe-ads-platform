version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tfe_user
      POSTGRES_PASSWORD: tfe_password
      POSTGRES_DB: tfe_ads
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # host 5433 -> avoids clashing with a local Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfe_user -d tfe_ads"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://tfe_user:tfe_password@db:5432/tfe_ads
      PUBLIC_BASE_URL: http://localhost:8000
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"

  dashboard:
    build:
      context: ./dashboard
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  db_data:
  uploads_data:
