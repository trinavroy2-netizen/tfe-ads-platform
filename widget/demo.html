<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>

    }

    .page {
      width: 100%;

      padding: 40px 20px;
    }

      margin: 0 0 10px;
      font-size: 28px;
    }

      margin: 0 0 30px;
      color: #666;
    }

    .ad-box {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
    }

    .tfe-ad-widget {
      width: 100%;
      max-width: 1320px;
      margin: 0 auto;
    }

    .content {
      margin-top: 40px;
      padding: 40px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .page {
        padding: 25px 15px;
      }

        padding: 25px;
      }

      h1 {
        font-size: 24px;

<body>

        data-api-base="http://127.0.0.1:8000">

    </div>

    <div class="content">
