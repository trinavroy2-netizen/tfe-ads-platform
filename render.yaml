services:
  - type: web
    name: tfe-ads-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tfe-ads-db
          property: connectionString

      - key: SECRET_KEY
        generateValue: true

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: CORS_ORIGINS
        value: "*"

      - key: PUBLIC_BASE_URL
        value: https://tfe-ads-backend.onrender.com

      - key: UPLOAD_DIR
        value: uploads

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"

      - key: ALGORITHM
        value: HS256

  - type: web
    name: tfe-ads-dashboard
    runtime: docker
    rootDir: dashboard
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_BASE
        value: https://tfe-ads-backend.onrender.com

databases:
  - name: tfe-ads-db
    databaseName: tfe_ads
    user: tfe_user
    plan: free
